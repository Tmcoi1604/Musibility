plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.musibility.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musibility.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'JAMENDO_CLIENT_ID', "\"${localProperties.getProperty('jamendo.clientId', '')}\""
        buildConfigField 'String', 'ACR_ACCESS_KEY', "\"${localProperties.getProperty('acrcloud.accessKey', '')}\""
        buildConfigField 'String', 'ACR_ACCESS_SECRET', "\"${localProperties.getProperty('acrcloud.accessSecret', '')}\""
        buildConfigField 'String', 'ACR_HOST', "\"${localProperties.getProperty('acrcloud.host', '')}\""
        buildConfigField 'String', 'GOOGLE_MAPS_KEY', "\"${localProperties.getProperty('google.maps.key', '')}\""
        manifestPlaceholders = [googleMapsKey: localProperties.getProperty('google.maps.key', '')]
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
}
