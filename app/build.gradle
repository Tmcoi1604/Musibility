plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

android {
    namespace 'com.musibility.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musibility.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'JAMENDO_CLIENT_ID', "\"${localProperties.getProperty('jamendo.clientId', '')}\""
        buildConfigField 'String', 'AUDD_API_TOKEN', "\"${localProperties.getProperty('audd.apiToken', '')}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'
}
